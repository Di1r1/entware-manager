name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.mod
      - name: Check dependencies
        run: |
          which go tar find tee python3
      - name: Go vet
        run: cd go && go vet ./...
      - name: Go test
        run: cd go && go test ./...
