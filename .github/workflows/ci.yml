name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.mod
      - name: Check dependencies
        run: |
          which go tar find tee python3 node
      - name: Go vet
        run: cd go && go vet ./...
      - name: Project tests
        run: make test
      - name: JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check
