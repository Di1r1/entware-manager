<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entware Manager</title>
    <meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/entware-manager/icons.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="/entware-manager/style.css?v=21">
    <script src="/entware-manager/modal.js?v=1"></script>
    <script src="/entware-manager/lib/utils.js?v=2"></script>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Entware Manager</h2>
                <div class="sidebar-description">Управление пакетами и системой</div>
                <div class="datetime" id="sidebarDatetime"></div>
                <div class="temp-widget-sidebar clickable" id="tempWidget" style="cursor:pointer;">
                    <span>
                        <svg class="icon" width="14" height="14" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <use href="/entware-manager/icons.svg?v=2#icon-thermometer"/>
                        </svg>
                        CPU: <span id="tempValue">--</span>°C
                    </span>
                </div>
                <div class="temp-widget-sidebar clickable" id="wifiTempWidget" style="cursor:pointer;">
                    <span>
                        <svg class="icon" width="14" height="14" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <use href="/entware-manager/icons.svg?v=2#icon-wifi"/>
                        </svg>
                        WiFi: <span id="wifiTempValue">--</span>
                    </span>
                </div>
                <div class="sidebar-icon">
                    <svg class="icon" width="40" height="40">
                        <use href="/entware-manager/icons.svg?v=2#icon-logo"/>
                    </svg>
                </div>
            </div>

            <button class="collapse-btn" id="collapseToggle">
                <svg class="icon" width="20" height="20">
                    <use href="/entware-manager/icons.svg?v=2#icon-chevron-left"/>
                </svg>
            </button>
            <button class="theme-toggle-edge" id="themeToggle">
                <svg class="icon" width="20" height="20">
                    <use href="/entware-manager/icons.svg?v=2#icon-sun"/>
                </svg>
            </button>

            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-container">
                <ul class="menu" id="dynamic-menu"></ul>
            </div>
            <div class="sidebar-footer">
                <a href="javascript:void(0)" onclick="checkSystemDeps()" class="sidebar-btn" style="margin-bottom:8px; display:block; text-align:center;">
                    <svg class="icon" width="14" height="14" style="vertical-align:middle; margin-right:4px;">
                        <use href="/entware-manager/icons.svg?v=2#icon-info"/>
                    </svg>
                    Проверка системы
                </a>
                <span class="version" id="sidebarVersion"></span>
            </div>
        </nav>
        <main class="content">
            <div id="content"></div>
            <div class="footer" id="mainFooter"></div>
        </main>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Информация</span>
                <span class="close">&times;</span>
            </div>
            <div id="modalBody">Загрузка...</div>
        </div>
    </div>

    <script src="/entware-manager/menu/menu.js?v=2"></script>
    <script src="/entware-manager/entware.js?v=2"></script>
    <script>
        function updateTemp() {
            fetch('/entware-cgi/temperature.cgi?_=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const temp = data.temperature;
                    const span = document.getElementById('tempValue');
                    if (temp !== null && temp !== undefined) {
                        span.textContent = temp;
                        fetch('/entware-cgi/temp_history.cgi?action=save&temp=' + encodeURIComponent(temp), {method:'POST'}).catch(()=>{});
                    } else {
                        span.textContent = '?';
                    }
                })
                .catch(() => { document.getElementById('tempValue').textContent = 'err'; });
        }

        function updateWifiTemp() {
            fetch('/entware-cgi/wifi_temp.cgi?_=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const combined = data.combined;
                    const span = document.getElementById('wifiTempValue');
                    span.textContent = combined || 'н/д';
                    if (data.temp0 !== null || data.temp1 !== null) {
                        fetch('/entware-cgi/wifi_temp_history.cgi?action=save&temp0=' + encodeURIComponent(data.temp0 || '-') + '&temp1=' + encodeURIComponent(data.temp1 || '-'), {method:'POST'}).catch(()=>{});
                    }
                })
                .catch(() => { document.getElementById('wifiTempValue').textContent = 'ошибка'; });
        }

        function showTempChart() {
            Modal.loading('Загрузка графика...');
            fetch('/entware-cgi/temp_history.cgi?action=history')
                .then(r => r.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        Modal.info('Нет данных о температуре. График появится через несколько минут.', 'Температура CPU');
                        return;
                    }
                    const temps = data.map(d => d.temp);
                    const times = data.map(d => d.time);
                    const minTemp = Math.min(...temps) - 5;
                    const maxTemp = Math.max(...temps) + 5;
                    const avg = Math.round(temps.reduce((a,b) => a+b, 0) / temps.length);
                    const now = temps[temps.length - 1];
                    let html = '<div style="text-align:center; margin-bottom:15px;">';
                    html += '<canvas id="tempChart" width="500" height="200" style="max-width:100%;"></canvas>';
                    html += '</div>';
                    html += '<div style="display:flex; justify-content:center; gap:30px;">';
                    html += '<div><small>Мин</small><br><b>' + Math.min(...temps) + '°C</b></div>';
                    html += '<div><small>Средняя</small><br><b>' + avg + '°C</b></div>';
                    html += '<div><small>Макс</small><br><b>' + Math.max(...temps) + '°C</b></div>';
                    html += '<div><small>Сейчас</small><br><b>' + now + '°C</b></div>';
                    html += '</div>';
                    Modal.show(html, false, 'Температура CPU (7 дней, ' + data.length + ' точек)');
                    setTimeout(() => drawSingleChart('tempChart', temps, times, minTemp, maxTemp, '#2ecc71'), 100);
                })
                .catch(() => Modal.error('Ошибка загрузки данных'));
        }

        function showWifiChart() {
            Modal.loading('Загрузка графика...');
            fetch('/entware-cgi/wifi_temp_history.cgi?action=history')
                .then(r => r.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        Modal.info('Нет данных о WiFi температуре. График появится через несколько минут.', 'Температура WiFi');
                        return;
                    }
                    const temps0 = data.map(d => d.temp0);
                    const temps1 = data.map(d => d.temp1);
                    const times = data.map(d => d.time);
                    const allTemps = [...temps0.filter(t => t !== null), ...temps1.filter(t => t !== null)];
                    if (allTemps.length === 0) {
                        Modal.info('Нет данных о WiFi температуре.', 'Температура WiFi');
                        return;
                    }
                    const minTemp = Math.min(...allTemps) - 5;
                    const maxTemp = Math.max(...allTemps) + 5;
                    let html = '<div style="text-align:center; margin-bottom:10px;">';
                    html += '<canvas id="wifiChart" width="500" height="220" style="max-width:100%;"></canvas>';
                    html += '</div>';
                    html += '<div style="display:flex; justify-content:center; gap:20px; font-size:12px;">';
                    html += '<div style="color:#3498db;"><span style="display:inline-block;width:12px;height:3px;background:#3498db;vertical-align:middle;margin-right:5px;"></span>WiFi0</div>';
                    html += '<div style="color:#e74c3c;"><span style="display:inline-block;width:12px;height:3px;background:#e74c3c;vertical-align:middle;margin-right:5px;"></span>WiFi1</div>';
                    html += '</div>';
                    Modal.show(html, false, 'Температура WiFi (7 дней, ' + data.length + ' точек)');
                    setTimeout(() => drawDualChart('wifiChart', temps0, temps1, times, minTemp, maxTemp), 100);
                })
                .catch(() => Modal.error('Ошибка загрузки данных'));
        }

        function drawSingleChart(canvasId, temps, times, minTemp, maxTemp, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const padding = 40;
            const chartW = w - padding * 2, chartH = h - padding * 2;
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#4a5568';
            ctx.font = '10px Inter, sans-serif';
            const steps = 4, tempRange = maxTemp - minTemp;
            for (let i = 0; i <= steps; i++) {
                const y = padding + (chartH / steps) * i;
                const temp = maxTemp - (tempRange / steps) * i;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();
                ctx.fillText(Math.round(temp) + '°', 5, y + 3);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }
            if (temps.length > 1) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                temps.forEach((t, i) => {
                    const x = padding + (chartW / (temps.length - 1)) * i;
                    const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.fillStyle = color;
                temps.forEach((t, i) => {
                    if (i % Math.ceil(temps.length / 10) !== 0 && i !== temps.length - 1) return;
                    const x = padding + (chartW / (temps.length - 1)) * i;
                    const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    if (times[i]) {
                        ctx.fillStyle = '#4a5568';
                        ctx.font = '8px Inter, sans-serif';
                        ctx.fillText(times[i], x - 12, h - 10);
                    }
                });
            }
        }

        function drawDualChart(canvasId, temps0, temps1, times, minTemp, maxTemp) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const padding = 40;
            const chartW = w - padding * 2, chartH = h - padding * 2;
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1;
            ctx.font = '10px Inter, sans-serif';
            const steps = 4, tempRange = maxTemp - minTemp;
            for (let i = 0; i <= steps; i++) {
                const y = padding + (chartH / steps) * i;
                const temp = maxTemp - (tempRange / steps) * i;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();
                ctx.fillStyle = '#4a5568';
                ctx.fillText(Math.round(temp) + '°', 5, y + 3);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }
            const drawLine = (temps, color) => {
                if (temps.length < 2) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let started = false;
                temps.forEach((t, i) => {
                    if (t === null) return;
                    const x = padding + (chartW / (temps.length - 1)) * i;
                    const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            };
            drawLine(temps0, '#3498db');
            drawLine(temps1, '#e74c3c');
        }

        document.getElementById('tempWidget').addEventListener('click', showTempChart);
        document.getElementById('wifiTempWidget').addEventListener('click', showWifiChart);

        updateTemp();
        setInterval(updateTemp, 30000);
        updateWifiTemp();
        setInterval(updateWifiTemp, 30000);

        fetch('/entware-manager/version.json')
            .then(r => r.json())
            .then(data => {
                window.APP_VERSION = data.version;
                document.title = `Entware Manager v${data.version}`;
                const footer = document.getElementById('mainFooter');
                if (footer) footer.innerHTML = `Entware Manager v${data.version} — интерфейс на базе CGI и вкладок`;
                const sidebarVersion = document.getElementById('sidebarVersion');
                if (sidebarVersion) sidebarVersion.textContent = `v${data.version}`;
            })
            .catch(e => { window.APP_VERSION = 'error'; console.error('Ошибка загрузки версии', e) });
    </script>
</body>
</html>
