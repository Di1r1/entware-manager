<!DOCTYPE html>
<html lang="ru">
<!-- Entware Manager — разработчик Di1r1 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entware Manager</title>
    <meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/entware-manager/icons.svg?v=4" type="image/svg+xml">
    <link rel="stylesheet" href="/entware-manager/style.css?v=37">
    <script src="/entware-manager/theme.js?v=2"></script>
    <script>if (window.Theme) Theme.init();</script>
    <script src="/entware-manager/modal.js?v=4"></script>
    <script src="/entware-manager/lib/utils.js?v=6"></script>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Entware Manager</h2>
                <div class="sidebar-description">Управление пакетами и системой</div>
                <div class="datetime" id="sidebarDatetime"></div>
                <div class="temp-widget-sidebar" id="tempWidget" style="cursor:pointer;">
                    <span>
                        <svg class="icon" width="14" height="14" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <use href="/entware-manager/icons.svg?v=4#icon-thermometer"/>
                        </svg>
                        CPU: <span id="tempValue">--</span><span id="tempUnit">°C</span>
                        &nbsp;&nbsp;
                        <svg class="icon" width="14" height="14" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <use href="/entware-manager/icons.svg?v=4#icon-wifi"/>
                        </svg>
                        WiFi: <span id="wifiTempValue">--</span>
                    </span>
                </div>
                <div class="sidebar-icon">
                    <svg class="icon" width="40" height="40">
                        <use href="/entware-manager/icons.svg?v=4#icon-logo"/>
                    </svg>
                </div>
            </div>

            <button class="collapse-btn" id="collapseToggle">
                <svg class="icon" width="20" height="20">
                    <use href="/entware-manager/icons.svg?v=4#icon-chevron-left"/>
                </svg>
            </button>
            <button class="theme-toggle-edge" id="themeToggle">
                <svg class="icon" width="20" height="20">
                    <use href="/entware-manager/icons.svg?v=4#icon-sun"/>
                </svg>
            </button>
            <div class="theme-popup" id="themePopup"></div>

            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-container">
                <ul class="menu" id="dynamic-menu"></ul>
            </div>
            <div class="sidebar-footer">
                <a href="javascript:void(0)" onclick="checkSystemDeps()" class="sidebar-btn" style="margin-bottom:8px; display:block; text-align:center;">
                    <svg class="icon" width="14" height="14" style="vertical-align:middle; margin-right:4px;">
                        <use href="/entware-manager/icons.svg?v=4#icon-info"/>
                    </svg>
                    Проверка системы
                </a>
                <a href="javascript:void(0)" onclick="doLogout()" id="logoutBtn" class="sidebar-btn" style="margin-bottom:8px; display:none; text-align:center;">
                    <svg class="icon" width="14" height="14" style="vertical-align:middle; margin-right:4px;">
                        <use href="/entware-manager/icons.svg?v=4#icon-lock"/>
                    </svg>
                    Выйти
                </a>
                <span class="version" id="sidebarVersion"></span>
            </div>
        </nav>
        <main class="content">
            <div id="content"></div>
            <div class="footer" id="mainFooter"></div>
        </main>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Информация</span>
                <span class="close">&times;</span>
            </div>
            <div id="modalBody">Загрузка...</div>
        </div>
    </div>

    <script src="/entware-manager/menu/menu.js?v=3"></script>
    <script src="/entware-manager/entware.js?v=54"></script>
    <script>
        function updateTemp() {
            fetch('/entware-cgi/temperature.cgi?_=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const temp = data.temperature;
                    const span = document.getElementById('tempValue');
                    const unit = document.getElementById('tempUnit');
                    if (temp !== null && temp !== undefined) {
                        span.textContent = temp;
                        if (unit) unit.style.display = '';
                        fetch('/entware-cgi/temp_history.cgi?action=save&temp=' + encodeURIComponent(temp), {method:'POST'}).catch(()=>{});
                    } else {
                        span.textContent = '—';
                        if (unit) unit.style.display = 'none';
                    }
                })
                .catch(() => { document.getElementById('tempValue').textContent = '—'; });
        }

        function updateWifiTemp() {
            fetch('/entware-cgi/wifi_temp.cgi?_=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const combined = data.combined;
                    const span = document.getElementById('wifiTempValue');
                    span.textContent = combined || '—';
                    if (data.temp0 !== null && data.temp0 !== 'null' && data.temp0 !== '-' && data.temp0 !== undefined ||
                        data.temp1 !== null && data.temp1 !== 'null' && data.temp1 !== '-' && data.temp1 !== undefined) {
                        fetch('/entware-cgi/wifi_temp_history.cgi?action=save&temp0=' + encodeURIComponent(data.temp0 || '-') + '&temp1=' + encodeURIComponent(data.temp1 || '-'), {method:'POST'}).catch(()=>{});
                    }
                })
                .catch(() => { document.getElementById('wifiTempValue').textContent = 'ошибка'; });
        }

        function drawSingleChart(canvasId, temps, times, minTemp, maxTemp, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const padding = 20;
            const chartW = w - padding * 2, chartH = h - padding * 2;
            const axisColor = '#a0aec0';

            function render(tooltipIdx) {
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = axisColor;
                ctx.lineWidth = 1;
                ctx.fillStyle = axisColor;
                ctx.font = '11px Inter, sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 3;
                const steps = 4, tempRange = maxTemp - minTemp;
                for (let i = 0; i <= steps; i++) {
                    const y = padding + (chartH / steps) * i;
                    const temp = maxTemp - (tempRange / steps) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding - 5, y);
                    ctx.lineTo(padding, y);
                    ctx.stroke();
                    ctx.shadowBlur = 3;
                    ctx.fillText(Math.round(temp) + '°', 5, y + 3);
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(w - padding, y);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                if (temps.length > 1) {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    temps.forEach((t, i) => {
                        const x = padding + (chartW / (temps.length - 1)) * i;
                        const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                    ctx.fillStyle = color;
                    temps.forEach((t, i) => {
                        const x = padding + (chartW / (temps.length - 1)) * i;
                        const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    const dateStep = Math.max(1, Math.ceil(temps.length / 10));
                    ctx.fillStyle = axisColor;
                    ctx.font = '9px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    temps.forEach((_, i) => {
                        if (i % dateStep !== 0 && i !== temps.length - 1) return;
                        const x = padding + (chartW / (temps.length - 1)) * i;
                        const date = times[i] ? times[i].split(' ')[0] : '';
                        ctx.shadowBlur = 2;
                        ctx.fillText(date, x, h - 8);
                        ctx.shadowBlur = 0;
                    });
                    ctx.textAlign = 'start';
                    if (tooltipIdx >= 0) {
                        const t = temps[tooltipIdx];
                        const tx = padding + (chartW / (temps.length - 1)) * tooltipIdx;
                        const ty = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(tx, padding);
                        ctx.lineTo(tx, h - padding);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        ctx.arc(tx, ty, 6, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        const label = times[tooltipIdx] + '  ' + t + '°C';
                        ctx.font = '13px Inter, sans-serif';
                        const tw = ctx.measureText(label).width;
                        let bx = tx - tw / 2 - 10;
                        if (bx < 5) bx = 5;
                        if (bx + tw + 20 > w) bx = w - tw - 20;
                        const by = padding + 4;
                        ctx.fillStyle = 'rgba(0,0,0,0.8)';
                        const r = 6;
                        ctx.beginPath();
                        ctx.roundRect(bx, by, tw + 20, 26, r);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.fillText(label, bx + 10, by + 18);
                    }
                }
            }

            canvas.renderFn = render;
            render(-1);
            canvas.onmousemove = function(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const mx = (e.clientX - rect.left) * scaleX;
                const idx = Math.round((mx - padding) / chartW * (temps.length - 1));
                if (idx < 0 || idx >= temps.length) { render(-1); return; }
                render(idx);
            };
            canvas.onmouseleave = function() { render(-1); };
        }

        function drawDualChart(canvasId, temps0, temps1, times, minTemp, maxTemp) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const padding = 20;
            const chartW = w - padding * 2, chartH = h - padding * 2;
            const axisColor = '#a0aec0';

            function render(tooltipIdx) {
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = axisColor;
                ctx.lineWidth = 1;
                ctx.fillStyle = axisColor;
                ctx.font = '11px Inter, sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                const steps = 4, tempRange = maxTemp - minTemp;
                for (let i = 0; i <= steps; i++) {
                    const y = padding + (chartH / steps) * i;
                    const temp = maxTemp - (tempRange / steps) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding - 5, y);
                    ctx.lineTo(padding, y);
                    ctx.stroke();
                    ctx.shadowBlur = 3;
                    ctx.fillText(Math.round(temp) + '°', 5, y + 3);
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(w - padding, y);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                const n = Math.max(temps0.length, temps1.length);
                const dateStep = Math.max(1, Math.ceil(n / 10));
                ctx.fillStyle = axisColor;
                ctx.font = '9px Inter, sans-serif';
                ctx.textAlign = 'center';
                for (let i = 0; i < n; i++) {
                    if (i % dateStep !== 0 && i !== n - 1) continue;
                    const x = padding + (chartW / (n - 1)) * i;
                    const date = times[i] ? times[i].split(' ')[0] : '';
                    ctx.shadowBlur = 2;
                    ctx.fillText(date, x, h - 8);
                    ctx.shadowBlur = 0;
                }
                ctx.textAlign = 'start';

                const drawLine = (temps, color) => {
                    if (temps.length < 2) return;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    let started = false;
                    temps.forEach((t, i) => {
                        if (t === null) return;
                        const x = padding + (chartW / (temps.length - 1)) * i;
                        const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                        if (!started) { ctx.moveTo(x, y); started = true; }
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                };
                const drawDots = (temps, color) => {
                    ctx.fillStyle = color;
                    temps.forEach((t, i) => {
                        if (t === null) return;
                        const x = padding + (chartW / (temps.length - 1)) * i;
                        const y = padding + chartH - ((t - minTemp) / tempRange) * chartH;
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                };
                drawLine(temps0, '#3498db');
                drawLine(temps1, '#e74c3c');
                drawDots(temps0, '#3498db');
                drawDots(temps1, '#e74c3c');

                if (tooltipIdx >= 0 && tooltipIdx < n) {
                    const tx = padding + (chartW / (n - 1)) * tooltipIdx;
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(tx, padding);
                    ctx.lineTo(tx, h - padding);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const v0 = temps0[tooltipIdx];
                    const v1 = temps1[tooltipIdx];

                    const drawTooltipDot = (val, color, yOffset) => {
                        if (val === null || val === undefined) return;
                        const yy = padding + chartH - ((val - minTemp) / tempRange) * chartH;
                        ctx.beginPath();
                        ctx.arc(tx, yy, 6, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    };
                    drawTooltipDot(v0, '#3498db', 0);
                    drawTooltipDot(v1, '#e74c3c', 0);

                    let label = times[tooltipIdx] || '';
                    if (v0 !== null && v0 !== undefined) label += '  WiFi0: ' + v0 + '°C';
                    if (v1 !== null && v1 !== undefined) label += '  WiFi1: ' + v1 + '°C';

                    ctx.font = '13px Inter, sans-serif';
                    const tw = ctx.measureText(label).width;
                    let bx = tx - tw / 2 - 10;
                    if (bx < 5) bx = 5;
                    if (bx + tw + 20 > w) bx = w - tw - 20;
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    const r = 6;
                    ctx.beginPath();
                    ctx.roundRect(bx, padding + 4, tw + 20, 26, r);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillText(label, bx + 10, padding + 22);
                    ctx.shadowBlur = 0;
                }
            }

            canvas.renderFn = render;
            render(-1);
            canvas.onmousemove = function(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const mx = (e.clientX - rect.left) * scaleX;
                const n = Math.max(temps0.length, temps1.length);
                const idx = Math.round((mx - padding) / chartW * (n - 1));
                if (idx < 0 || idx >= n) { render(-1); return; }
                render(idx);
            };
            canvas.onmouseleave = function() { render(-1); };
        }

        document.getElementById('tempWidget').addEventListener('click', showAllCharts);

        function showAllCharts() {
            Modal.loading('Загрузка графиков...');
            Promise.all([
                fetch('/entware-cgi/temp_history.cgi?action=history').then(r => r.json()),
                fetch('/entware-cgi/wifi_temp_history.cgi?action=history').then(r => r.json())
            ]).then(([cpuData, wifiData]) => {
                let html = '';

                if (cpuData && cpuData.length > 0) {
                    const temps = cpuData.map(d => d.temp);
                    const times = cpuData.map(d => d.time);
                    const minTemp = Math.min(...temps) - 5;
                    const maxTemp = Math.max(...temps) + 5;
                    const avg = Math.round(temps.reduce((a,b) => a+b, 0) / temps.length);
                    const now = temps[temps.length - 1];

                    html += '<h4 style="margin:0 0 6px 0; font-size:1.1em; font-weight:700; color:var(--text-primary); text-shadow:0 2px 6px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.2);">CPU</h4>';
                    html += '<div style="text-align:center;">';
                    html += '<canvas id="cpuChart" width="900" height="190" style="width:100%;"></canvas>';
                    html += '</div>';
                    const minVal = Math.min(...temps);
                    const maxVal = Math.max(...temps);
                    const minIdx = temps.indexOf(minVal);
                    const maxIdx = temps.indexOf(maxVal);
                    const nowIdx = temps.length - 1;
                    const avgIdx = temps.reduce((best, t, i) => Math.abs(t - avg) < Math.abs(temps[best] - avg) ? i : best, 0);

                    html += '<div class="temp-stats" style="margin-bottom:8px;" id="cpuStats">';
                    html += '<div class="temp-stat" data-idx="' + minIdx + '"><div class="label" style="text-shadow:0 1px 2px rgba(0,0,0,0.2);">Мин</div><div class="value" style="text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + minVal + '°C</div></div>';
                    html += '<div class="temp-stat" data-idx="' + avgIdx + '"><div class="label" style="text-shadow:0 1px 2px rgba(0,0,0,0.2);">Средняя</div><div class="value" style="text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + avg + '°C</div></div>';
                    html += '<div class="temp-stat" data-idx="' + maxIdx + '"><div class="label" style="text-shadow:0 1px 2px rgba(0,0,0,0.2);">Макс</div><div class="value" style="text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + maxVal + '°C</div></div>';
                    html += '<div class="temp-stat" data-idx="' + nowIdx + '"><div class="label" style="text-shadow:0 1px 2px rgba(0,0,0,0.2);">Сейчас</div><div class="value" style="text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + now + '°C</div></div>';
                    html += '</div>';

                    setTimeout(() => {
                        drawSingleChart('cpuChart', temps, times, minTemp, maxTemp, '#2ecc71');
                        const canvas = document.getElementById('cpuChart');
                        document.querySelectorAll('#cpuStats .temp-stat').forEach(el => {
                            el.addEventListener('click', () => {
                                if (canvas && canvas.renderFn) canvas.renderFn(parseInt(el.dataset.idx));
                            });
                        });
                    }, 100);
                }

                if (wifiData && wifiData.length > 0) {
                    const temps0 = wifiData.map(d => d.temp0);
                    const temps1 = wifiData.map(d => d.temp1);
                    const times = wifiData.map(d => d.time);
                    const allTemps = [...temps0.filter(t => t !== null), ...temps1.filter(t => t !== null)];

                    if (allTemps.length > 0) {
                        const minTemp = Math.min(...allTemps) - 5;
                        const maxTemp = Math.max(...allTemps) + 5;
                        var now0 = wifiData[wifiData.length-1].temp0;
                        var now1 = wifiData[wifiData.length-1].temp1;

                        html += '<h4 style="margin:0 0 6px 0; font-size:1.1em; font-weight:700; color:var(--text-primary); text-shadow:0 2px 6px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.2);">WiFi</h4>';
                        html += '<div style="text-align:center;">';
                        html += '<canvas id="wifiChart2" width="900" height="190" style="width:100%;"></canvas>';
                        html += '</div>';
                        html += '<div class="temp-stats" id="wifiStats">';
                        html += '<div class="temp-stat"><div class="label" style="color:#3498db; text-shadow:0 1px 2px rgba(0,0,0,0.2);">WiFi0</div><div class="value" data-wifi="0" style="color:#3498db; text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + (now0 !== null ? now0 + '°C' : '—') + '</div></div>';
                        html += '<div class="temp-stat"><div class="label" style="color:#e74c3c; text-shadow:0 1px 2px rgba(0,0,0,0.2);">WiFi1</div><div class="value" data-wifi="1" style="color:#e74c3c; text-shadow:0 1px 3px rgba(0,0,0,0.3);cursor:pointer;">' + (now1 !== null ? now1 + '°C' : '—') + '</div></div>';
                        html += '</div>';

                        setTimeout(() => {
                            drawDualChart('wifiChart2', temps0, temps1, times, minTemp, maxTemp);
                            const canvas2 = document.getElementById('wifiChart2');
                            document.querySelectorAll('#wifiStats .value[data-wifi]').forEach(el => {
                                el.addEventListener('click', () => {
                                    if (canvas2 && canvas2.renderFn) canvas2.renderFn(times.length - 1);
                                });
                            });
                        }, 200);
                    }
                }

                if (!html) {
                    Modal.info('Нет данных. Графики появятся через несколько минут.', 'Температура');
                    return;
                }

                Modal.show(html, false, 'Температура');
            }).catch(() => Modal.error('Ошибка загрузки данных'));
        }

        // Виджеты запускаются после авторизации (entware.js: startPanelWidgets()),
        // чтобы не делать гейченных запросов до входа в панель.
    </script>

    <!-- Экран входа (показывается, если в разделе «Защита» задан пароль) -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">
                <svg class="icon" width="40" height="40"><use href="/entware-manager/icons.svg?v=4#icon-lock"/></svg>
            </div>
            <h2>Entware Manager</h2>
            <p class="login-sub">Введите пароль панели (задаётся в Настройки → Защита)</p>
            <input type="password" id="loginPassword" class="settings-input" placeholder="Пароль" autocomplete="current-password">
            <button id="loginBtn" class="packages-delete-btn" style="width:100%;justify-content:center;">Войти</button>
            <p id="loginError" class="error" style="display:none;margin-top:8px;"></p>
        </div>
    </div>
</body>
