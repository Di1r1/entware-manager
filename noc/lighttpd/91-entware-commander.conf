# Entware Commander (experiment branch): static NOC console.
# Original panel /entware-manager/ (entware-server:8087) is NOT touched.
alias.url += (
    "/entware-commander/" => "/opt/entware-commander/",
)

# NOC experiment: same-origin API for /entware-commander/ pages.
# Proxies panel CGI (:8087) so the browser stays same-origin (no CORS).
# Auth (cookie commander_session) is enforced by the backend itself.
$HTTP["url"] =~ "^/entware-cgi/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8087 ) ) )
}

# NOC experiment: local CGI (own branch, original panel untouched).
$HTTP["url"] =~ "^/entware-commander/noc/cgi-bin/" {
    cgi.assign = ( "" => "" )
}
