# NOC-консоль внутри менеджера: /entware-manager/noc/ → /opt/web_entware/noc/.
# Классика (/entware-manager/ из 90-conf) не тронута.
alias.url += (
    "/entware-manager/noc/" => "/opt/web_entware/noc/",
)

# Same-origin API для NOC: прокси CGI панели (:8087).
# Авторизация — гейтом бэкенда (сессия panel_session).
$HTTP["url"] =~ "^/entware-cgi/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8087 ) ) )
}

# Локальный procs.cgi NOC (shell, без jq/pgrep).
$HTTP["url"] =~ "^/entware-manager/noc/cgi-bin/" {
    cgi.assign = ( "" => "" )
}

# Защита: из префикса NOC не отдаём код и конфиги
# (зеркало правил 90-conf; cgi-bin исключён — его исполняет mod_cgi).
$HTTP["url"] =~ "^/entware-manager/noc/" {
    $HTTP["url"] !~ "^/entware-manager/noc/cgi-bin/" {
        url.access-deny = ( "~", ".sh", ".conf", ".md", ".cgi" )
        $HTTP["url"] =~ "^/entware-manager/noc/[a-z_]+_config\.json$" {
            url.access-deny = ( "" )
        }
    }
}
