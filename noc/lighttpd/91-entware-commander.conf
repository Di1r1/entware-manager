# NOC-консоль внутри менеджера: /entware-manager/noc/ → /opt/web_entware/noc/.
# ТОЛЬКО для EWM_MODE=lighttpd (панель сама на общем lighttpd :8087).
# В go-режиме НЕ ставится: NOC отдаёт entware-server (:8087, whitelist
# в go/internal/server/static.go), install.sh удаляет этот файл из conf.d.
# Классика (/entware-manager/ из 90-conf) не тронута.
alias.url += (
    "/entware-manager/noc/" => "/opt/web_entware/noc/",
)

# Same-origin API для NOC: прокси CGI панели (:8087).
# Авторизация — гейтом бэкенда (сессия panel_session).
# Топ процессов — Go-эндпоинт /entware-cgi/monitor/procs.cgi (shell procs.cgi
# больше не исполняется; файл остался как референс, отдача .cgi запрещена ниже).
$HTTP["url"] =~ "^/entware-cgi/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8087 ) ) )
}

# Статика панели для NOC-iframe (логер и др.): прокси на Go-сервер,
# там whitelist. Исключение — /noc/ (свой алиас выше, не проксируем).
$HTTP["url"] =~ "^/entware-manager/" {
    $HTTP["url"] !~ "^/entware-manager/noc/" {
        proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8087 ) ) )
    }
}

# Защита: из префикса NOC не отдаём код и конфиги
# (зеркало правил 90-conf).
$HTTP["url"] =~ "^/entware-manager/noc/" {
    url.access-deny = ( "~", ".sh", ".conf", ".md", ".cgi" )
    $HTTP["url"] =~ "^/entware-manager/noc/[a-z_]+_config\.json$" {
        url.access-deny = ( "" )
    }
}
