<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- === Основные иконки (были ранее) === -->
  <symbol id="icon-stats" viewBox="0 0 16 16">
    <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor"/>
    <line x1="2" y1="6" x2="14" y2="6" stroke="currentColor"/>
    <line x1="6" y1="6" x2="6" y2="14" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-package" viewBox="0 0 16 16">
    <rect x="3" y="4" width="10" height="8" rx="1" fill="none" stroke="currentColor"/>
    <line x1="3" y1="7" x2="13" y2="7" stroke="currentColor"/>
    <line x1="6" y1="4" x2="6" y2="7" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-update" viewBox="0 0 16 16">
    <path d="M4 7a4 4 0 0 1 7-1.5L12.5 4" fill="none" stroke="currentColor"/>
    <path d="M11 5.5V3" fill="none" stroke="currentColor"/>
    <path d="M12 9a4 4 0 0 1-7 1.5L3.5 12" fill="none" stroke="currentColor"/>
    <path d="M5 10.5v2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-process" viewBox="0 0 16 16">
    <rect x="3" y="3" width="10" height="10" rx="2" fill="none" stroke="currentColor"/>
    <polyline points="4,11 7,8 9,10 12,6" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-terminal" viewBox="0 0 16 16">
    <rect x="2" y="3" width="12" height="10" rx="1" fill="none" stroke="currentColor"/>
    <polyline points="5,6 7,8 5,10" fill="none" stroke="currentColor"/>
    <line x1="8.5" y1="10" x2="11" y2="10" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-services" viewBox="0 0 16 16">
    <circle cx="4" cy="8" r="1" stroke="currentColor" fill="none"/>
    <circle cx="8" cy="8" r="1" stroke="currentColor" fill="none"/>
    <circle cx="12" cy="8" r="1" stroke="currentColor" fill="none"/>
    <line x1="5" y1="8" x2="7" y2="8" stroke="currentColor"/>
    <line x1="9" y1="8" x2="11" y2="8" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="2" fill="none" stroke="currentColor"/>
    <path d="M8 3v2M8 11v2M3 8h2M11 8h2M4.5 4.5l1.2 1.2M10.3 10.3l1.2 1.2M10.3 4.5l-1.2 1.2M4.5 10.3l1.2-1.2" stroke="currentColor" fill="none"/>
  </symbol>
  <symbol id="icon-help" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="5" fill="none" stroke="currentColor"/>
    <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor"/>
    <circle cx="8" cy="11.5" r="0.7" fill="currentColor"/>
  </symbol>
  <symbol id="icon-memory" viewBox="0 0 16 16">
    <rect x="3" y="5" width="10" height="6" rx="1" fill="none" stroke="currentColor"/>
    <line x1="4" y1="4" x2="4" y2="3" stroke="currentColor"/>
    <line x1="8" y1="4" x2="8" y2="3" stroke="currentColor"/>
    <line x1="12" y1="4" x2="12" y2="3" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-disk" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="5" fill="none" stroke="currentColor"/>
    <circle cx="8" cy="8" r="1.5" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-folder" viewBox="0 0 16 16">
    <path d="M2 4h3l1-2h4l1 2h3v8H2V4z" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-router" viewBox="0 0 16 16">
    <circle cx="8" cy="4" r="2" fill="none" stroke="currentColor"/>
    <line x1="8" y1="6" x2="8" y2="12" stroke="currentColor"/>
    <circle cx="4" cy="12" r="2" fill="none" stroke="currentColor"/>
    <circle cx="12" cy="12" r="2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 16 16">
    <path d="M8 2l5 3v3c0 4-3 6-5 6s-5-2-5-6V5z" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-shield-alt" viewBox="0 0 16 16">
    <path d="M8 2c3 2 4 4 4 6a4 4 0 1 1-8 0c0-2 1-4 4-6z" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-download" viewBox="0 0 16 16">
    <polyline points="4,6 8,10 12,6" fill="none" stroke="currentColor"/>
    <line x1="8" y1="10" x2="8" y2="2" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-chart" viewBox="0 0 16 16">
    <polyline points="3,11 6,7 9,9 13,4" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-link" viewBox="0 0 16 16">
    <line x1="4" y1="8" x2="12" y2="8" stroke="currentColor"/>
    <circle cx="4" cy="8" r="2" fill="none" stroke="currentColor"/>
    <circle cx="12" cy="8" r="2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 16 16">
    <polyline points="10,3 15,8 10,13" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-refresh" viewBox="0 0 16 16">
    <path d="M4 7a4 4 0 0 1 7-1.5L12.5 4" fill="none" stroke="currentColor"/>
    <path d="M11 5.5V3" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-list" viewBox="0 0 16 16">
    <rect x="3" y="3" width="10" height="10" rx="1" fill="none" stroke="currentColor"/>
    <line x1="5" y1="6" x2="11" y2="6" stroke="currentColor"/>
    <line x1="5" y1="9" x2="11" y2="9" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-sun" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor"/>
    <line x1="8" y1="1" x2="8" y2="4" stroke="currentColor"/>
    <line x1="8" y1="12" x2="8" y2="15" stroke="currentColor"/>
    <line x1="1" y1="8" x2="4" y2="8" stroke="currentColor"/>
    <line x1="12" y1="8" x2="15" y2="8" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-moon" viewBox="0 0 16 16">
    <path d="M13 8a5 5 0 1 1-5-5c2 0 3 1 3 2s-1 2-2 2 1 1 1 2 0 2-2 2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-logo" viewBox="0 0 40 40">
    <rect x="4" y="6" width="32" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="4" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M20 14v4M20 22v4" stroke="currentColor" stroke-width="1.5"/>
    <path d="M14 20h4M22 20h4" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="icon-default" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="5" fill="none" stroke="currentColor"/>
    <line x1="5" y1="5" x2="11" y2="11" stroke="currentColor"/>
    <line x1="11" y1="5" x2="5" y2="11" stroke="currentColor"/>
  </symbol>

  <!-- === НОВЫЕ ИКОНКИ === -->
  <symbol id="icon-email" viewBox="0 0 16 16">
    <rect x="2" y="4" width="12" height="8" rx="1" fill="none" stroke="currentColor"/>
    <polyline points="2,5 8,9 14,5" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-camera" viewBox="0 0 16 16">
    <rect x="3" y="5" width="10" height="7" rx="1" fill="none" stroke="currentColor"/>
    <rect x="5" y="3" width="3" height="2" rx="0.5" fill="none" stroke="currentColor"/>
    <circle cx="8" cy="8.5" r="2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 16 16">
    <circle cx="7" cy="7" r="3" fill="none" stroke="currentColor"/>
    <line x1="9.5" y1="9.5" x2="12" y2="12" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-cloud" viewBox="0 0 16 16">
    <path d="M5 11a3 3 0 1 1 1-5 3 3 0 0 1 5 2 2.5 2.5 0 0 1-1 3H5z" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-user" viewBox="0 0 16 16">
    <circle cx="8" cy="5" r="2.5" fill="none" stroke="currentColor"/>
    <path d="M4 12a4 4 0 0 1 8 0" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 16 16">
    <rect x="3" y="4" width="10" height="9" rx="1" fill="none" stroke="currentColor"/>
    <line x1="3" y1="6" x2="13" y2="6" stroke="currentColor"/>
    <line x1="6" y1="2.5" x2="6" y2="4" stroke="currentColor"/>
    <line x1="10" y1="2.5" x2="10" y2="4" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-notes" viewBox="0 0 16 16">
    <rect x="3" y="3" width="10" height="10" rx="1" fill="none" stroke="currentColor"/>
    <line x1="5" y1="6" x2="11" y2="6" stroke="currentColor"/>
    <line x1="5" y1="9" x2="11" y2="9" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-rss" viewBox="0 0 16 16">
    <circle cx="4" cy="12" r="1" fill="currentColor"/>
    <path d="M4 8a4 4 0 0 1 4 4" fill="none" stroke="currentColor"/>
    <path d="M4 5a7 7 0 0 1 7 7" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-vpn" viewBox="0 0 16 16">
    <circle cx="8" cy="6" r="3" fill="none" stroke="currentColor"/>
    <path d="M4 12a4 4 0 0 1 8 0" fill="none" stroke="currentColor"/>
    <line x1="6" y1="6" x2="10" y2="6" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-file" viewBox="0 0 16 16">
    <path d="M5 2h5l3 3v9H5z" fill="none" stroke="currentColor"/>
    <path d="M10 2v3h3" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-music" viewBox="0 0 16 16">
    <path d="M7 3v7a2 2 0 1 1-1.5-2" fill="none" stroke="currentColor"/>
    <path d="M7 3l5-1v7a2 2 0 1 1-1.5-2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-video" viewBox="0 0 16 16">
    <rect x="3" y="4" width="8" height="8" rx="1" fill="none" stroke="currentColor"/>
    <polygon points="7,6 10,8 7,10" fill="currentColor"/>
  </symbol>
  <symbol id="icon-weather" viewBox="0 0 16 16">
    <circle cx="6" cy="6" r="2.5" fill="none" stroke="currentColor"/>
    <path d="M4 11a3 3 0 0 1 5-2 2 2 0 0 1 3 2H4z" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-lock" viewBox="0 0 16 16">
    <rect x="4" y="7" width="8" height="6" rx="1" fill="none" stroke="currentColor"/>
    <path d="M6 7V5a2 2 0 0 1 4 0v2" fill="none" stroke="currentColor"/>
  </symbol>
  <symbol id="icon-home" viewBox="0 0 16 16">
    <polyline points="3,8 8,3 13,8" fill="none" stroke="currentColor"/>
    <rect x="5" y="8" width="6" height="5" fill="none" stroke="currentColor"/>
  </symbol>
  <!-- Иконки для статусов служб -->
  <symbol id="icon-check" viewBox="0 0 16 16">
    <polyline points="3,8 7,12 13,4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="icon-cross" viewBox="0 0 16 16">
    <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
    <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
    <!-- Иконка термометра -->
  <symbol id="icon-thermometer" viewBox="0 0 16 16">
    <path d="M8 2v8.5a2.5 2.5 0 1 1-2 0V2h2z" fill="none" stroke="currentColor"/>
    <circle cx="7" cy="12.5" r="1.5" fill="none" stroke="currentColor"/>
  </symbol>
  <!-- Иконка Wi-Fi -->
  <symbol id="icon-wifi" viewBox="0 0 16 16">
    <path d="M2 5l2-2a10 10 0 0 1 12 0l2 2" fill="none" stroke="currentColor"/>
    <path d="M5 8l2-2a6 6 0 0 1 6 0l2 2" fill="none" stroke="currentColor"/>
    <circle cx="8" cy="11" r="1.5" fill="none" stroke="currentColor"/>
  </symbol>
  <!-- Иконка HDD/SMART -->
  <symbol id="icon-hdd" viewBox="0 0 16 16">
    <rect x="2" y="4" width="12" height="8" rx="1" fill="none" stroke="currentColor"/>
    <rect x="4" y="3" width="8" height="2" rx="0.5" fill="currentColor"/>
    <circle cx="8" cy="8" r="1.5" fill="none" stroke="currentColor"/>
  </symbol>
    <!-- Иконки сортировки -->
  <symbol id="icon-sort-asc" viewBox="0 0 16 16">
    <polyline points="8,4 12,8 4,8 8,4" fill="none" stroke="#ffffff"/>
  </symbol>
  <symbol id="icon-sort-desc" viewBox="0 0 16 16">
    <polyline points="8,12 12,8 4,8 8,12" fill="none" stroke="#ffffff"/>
  </symbol>
   <symbol id="icon-chevron-left" viewBox="0 0 16 16">
  <polyline points="10,4 6,8 10,12" fill="none" stroke="currentColor"/>
</symbol>
<symbol id="icon-chevron-right" viewBox="0 0 16 16">
  <polyline points="6,4 10,8 6,12" fill="none" stroke="currentColor"/>
</symbol>
<symbol id="icon-close" viewBox="0 0 16 16">
  <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor"/>
  <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor"/>
</symbol>
<symbol id="icon-trash" viewBox="0 0 16 16">
  <polyline points="3,5 4,13 12,13 13,5" fill="none" stroke="currentColor"/>
  <line x1="2" y1="5" x2="14" y2="5" stroke="currentColor"/>
  <line x1="6" y1="8" x2="6" y2="11" stroke="currentColor"/>
  <line x1="10" y1="8" x2="10" y2="11" stroke="currentColor"/>
</symbol>
<symbol id="icon-arrow-left" viewBox="0 0 16 16">
  <polyline points="6,4 1,8 6,12" fill="none" stroke="currentColor"/>
</symbol>
<symbol id="icon-play" viewBox="0 0 16 16">
  <polygon points="4,3 13,8 4,13" fill="none" stroke="currentColor"/>
</symbol>
<symbol id="icon-stop" viewBox="0 0 16 16">
  <rect x="4" y="4" width="8" height="8" fill="none" stroke="currentColor"/>
</symbol>
<symbol id="icon-alert" viewBox="0 0 16 16">
  <path d="M8 2L2 14h12L8 2z" fill="none" stroke="currentColor"/>
  <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor"/>
  <circle cx="8" cy="12" r="0.5" fill="currentColor"/>
</symbol>
</svg>
